<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <title>1 Month After today</title>
</head>
<body>
    
    <script>
        let today = dayjs();
        let nextMonth = today.add(1, 'month');
        let nextMonthFormat = nextMonth.format('MMMM D');
        console.log(nextMonthFormat);
    </script>
</body>
</html>
