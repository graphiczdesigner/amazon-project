<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
	<title>External Libraries Practice</title>
</head>
<body>
	<p class="js-today-date"></p>

	<script>
		let date = dayjs();
		console.log(date.format());
		
		console.log(date.format('DD/MM/YYYY'));
		console.log(date.format('MMMM D, YYYY'));

		let kal = date.add(1, 'day');
		console.log(kal.format('MMMM D, YYYY'));

		let yesterday = date.subtract(1, 'day');
		console.log(yesterday.format('MMMM D, YYYY'));

		// Compare / Days Count how much left
		const birthday = dayjs('2026-10-20');
		let daysLeft = birthday.diff(date, 'days');
		console.log(`${daysLeft} Days left in my Birthday.`);

		// Practice Examples
		let todayDate = date.format('dddd, DD MM YYYY');
		document.querySelector('.js-today-date')
			.innerHTML = todayDate;

	</script>

	
</body>
</html>
